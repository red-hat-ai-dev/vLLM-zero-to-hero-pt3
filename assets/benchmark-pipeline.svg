<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" role="img" aria-labelledby="title description">
  <title id="title">The benchmarking pipeline</title>
  <desc id="description">Serve a model with vLLM, benchmark it with GuideLLM, evaluate it with lm-eval, repeat for the optimized model, and compare the results.</desc>

  <rect x="1" y="1" width="1198" height="370" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="56" y="60" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PART 3</text>
  <text x="56" y="100" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Measure speed and accuracy</text>
  <line x1="56" y1="124" x2="1144" y2="124" stroke="#ee0000" stroke-width="3"/>

  <g transform="translate(56 150)">
    <rect width="248" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">01</text>
    <text x="64" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Serve</text>
    <text x="24" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Start the baseline or</text>
    <text x="24" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">optimized model</text>
    <text x="24" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">./run.sh</text>
  </g>
  <g transform="translate(336 150)">
    <rect width="248" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">02</text>
    <text x="64" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Benchmark</text>
    <text x="24" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Measure latency and</text>
    <text x="24" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">throughput with GuideLLM</text>
    <text x="24" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">./benchmark.sh</text>
  </g>
  <g transform="translate(616 150)">
    <rect width="248" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">03</text>
    <text x="64" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Evaluate</text>
    <text x="24" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Measure accuracy</text>
    <text x="24" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">with lm-eval</text>
    <text x="24" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">./evaluate.sh</text>
  </g>
  <g transform="translate(896 150)">
    <rect width="248" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">04</text>
    <text x="64" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Compare</text>
    <text x="24" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Put both runs</text>
    <text x="24" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">side by side</text>
    <text x="24" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">./compare.sh</text>
  </g>
  <path d="M309 221 h12" stroke="#ee0000" stroke-width="3"/><path d="M319 214 l10 7 l-10 7 z" fill="#ee0000"/>
  <path d="M589 221 h12" stroke="#ee0000" stroke-width="3"/><path d="M599 214 l10 7 l-10 7 z" fill="#ee0000"/>
  <path d="M869 221 h12" stroke="#ee0000" stroke-width="3"/><path d="M879 214 l10 7 l-10 7 z" fill="#ee0000"/>
  <path d="M740 300 v18 H180 v-18" fill="none" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M173 306 l7 -10 l7 10 z" fill="#6e7781"/>
  <text x="460" y="344" fill="#6e7781" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13">Repeat steps 1 to 3 for the optimized model</text>
</svg>
